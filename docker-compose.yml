services:
  netbird-proxy-dashboard:
    build: .
    image: netbird-proxy-dashboard:latest
    container_name: netbird-proxy-dashboard
    restart: unless-stopped
    environment:
      NB_API_BASE: ${NB_API_BASE}
      NB_API_TOKEN: ${NB_API_TOKEN}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      INITIAL_BACKFILL_DAYS: ${INITIAL_BACKFILL_DAYS:-7}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      ANOMALY_DENY_THRESHOLD: ${ANOMALY_DENY_THRESHOLD:-10}
      CROWDSEC_API_URL: ${CROWDSEC_API_URL:-}
      CROWDSEC_MACHINE_ID: ${CROWDSEC_MACHINE_ID:-}
      CROWDSEC_MACHINE_PASSWORD: ${CROWDSEC_MACHINE_PASSWORD:-}
      WHITELIST_FILE_PATH: /whitelist/netbird-proxy-whitelist.yaml
      WHITELIST_CONTAINER_NAME: ${WHITELIST_CONTAINER_NAME:-netbird-logparser}
      ASN_ENRICHMENT_ENABLED: ${ASN_ENRICHMENT_ENABLED:-false}
      ASN_MMDB_URL: ${ASN_MMDB_URL:-https://hub-data.crowdsec.net/mmdb_update/GeoLite2-ASN.mmdb}
      CROWDSEC_FP_NOTIFY_URL: ${CROWDSEC_FP_NOTIFY_URL:-}
      CROWDSEC_FP_NOTIFY_TOKEN: ${CROWDSEC_FP_NOTIFY_TOKEN:-}
      BACKUP_SYNC_HOST: ${BACKUP_SYNC_HOST:-}
      BACKUP_SYNC_USER: ${BACKUP_SYNC_USER:-root}
      BACKUP_SYNC_DEST: ${BACKUP_SYNC_DEST:-/opt/backup-proxy/certs}
      BACKUP_SYNC_REMOTE_CMD: ${BACKUP_SYNC_REMOTE_CMD:-/opt/backup-proxy/regenerate-nginx.sh}
      BACKUP_SYNC_INTERVAL_MINUTES: ${BACKUP_SYNC_INTERVAL_MINUTES:-15}
      BUNKERWEB_CONTAINER_NAME: ${BUNKERWEB_CONTAINER_NAME:-}
      BUNKERWEB_PROXY_IP: ${BUNKERWEB_PROXY_IP:-}
      # Domain-Verwaltung (Seite /domains): BunkerWeb-Compose-Verzeichnis (gleicher
      # Pfad wie auf dem Host, damit docker-compose es identisch ausfuehrt) und die
      # Traefik-File-Provider-Datei. Leer = Seite nur lesend.
      BW_COMPOSE_DIR: ${BW_COMPOSE_DIR:-}
      TRAEFIK_DYNAMIC_PATH: ${BW_COMPOSE_DIR:+/traefik/dynamic.yaml}
      DOMAINS_PROBE_HOST: ${DOMAINS_PROBE_HOST:-}
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      - ./data:/data
      # Docker-Socket: fuer den expliziten "Anwenden"-Knopf im Whitelist-Widget,
      # der netbird-logparser neu startet, damit eine geaenderte Whitelist-Datei
      # geladen wird (CrowdSec liest Parser-Config nur beim Start neu ein) - und,
      # falls BUNKERWEB_CONTAINER_NAME gesetzt ist, zum Lesen der BunkerWeb-Logs.
      - /var/run/docker.sock:/var/run/docker.sock
      # Die lokale CrowdSec-Whitelist-Datei von netbird-logparser - hier kann das
      # Dashboard Eintraege hinzufuegen/entfernen (wirksam erst nach obigem Neustart).
      - ${WHITELIST_HOST_FILE_PATH:-/opt/netbird/netbird-logparser/postoverflows/s01-whitelist/netbird-proxy-whitelist.yaml}:/whitelist/netbird-proxy-whitelist.yaml
      # Backup-Proxy-Sync: Zertifikate von netbird-proxy (nur lesend) + SSH-Key fuer
      # rsync/ssh auf den Backup-Proxy. Ohne BACKUP_SYNC_HOST bleibt beides ungenutzt.
      - ${BACKUP_SYNC_HOST_CERT_DIR:-/var/lib/docker/volumes/root_netbird_proxy_certs/_data}:/backup-sync/certs:ro
      - ${BACKUP_SYNC_HOST_SSH_KEY:-/root/.ssh/backup-proxy-sync}:/backup-sync/ssh_key:ro
      # Domain-Verwaltung: BunkerWeb-Compose (Sites-Datei schreiben, bw-scheduler per
      # docker-compose neu erstellen), Traefik-Datei (Router pro Domain, wird in place
      # geschrieben) und das docker-compose-Binary des Hosts (statisch gelinkt, gleiche
      # Version wie auf dem Host -> identische Config-Hashes).
      - ${BW_COMPOSE_DIR:-/nonexistent-bunkerweb}:${BW_COMPOSE_DIR:-/nonexistent-bunkerweb}
      - ${TRAEFIK_DYNAMIC_HOST_PATH:-/opt/netbird/traefik-dynamic.yaml}:/traefik/dynamic.yaml
      - ${DOCKER_COMPOSE_HOST_BIN:-/usr/libexec/docker/cli-plugins/docker-compose}:/usr/local/bin/docker-compose:ro
    ports:
      # Bindet den Port NUR an deine eigene NetBird-Interface-IP.
      # Dadurch ist das Dashboard ausschliesslich ueber das NetBird-Mesh erreichbar
      # (kein zusaetzliches Passwort noetig). IP ermitteln mit:
      #   netbird status   ->  NetBird IP
      # oder
      #   ip a show wt0
      - "${DASHBOARD_BIND_IP}:${DASHBOARD_PORT:-8098}:8098"

    # Falls netbird-management im selben Compose-Projekt / selben Docker-Netzwerk
    # laeuft, kann NB_API_BASE direkt auf den Containernamen zeigen
    # (z.B. http://management:80 oder http://netbird-management:80)
    # statt ueber die oeffentliche Domain + Traefik zu gehen. Dazu einfach das externe
    # Netzwerk unten aktivieren und den Namen an das tatsaechliche Netz/Servicename anpassen:
    #
    # networks:
    #   - netbird_default
    #
# networks:
#   netbird_default:
#     external: true
