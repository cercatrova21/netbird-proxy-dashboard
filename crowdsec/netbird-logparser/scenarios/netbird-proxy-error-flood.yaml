type: leaky
name: netbird-proxy/error-flood
description: >
  Häufung von Backend-Fehlern derselben IP - deutet auf systematisches
  Scannen hin. Nur Sichtbarkeit, keine automatische Sperrung: 502er haeufen
  sich auch bei legitimem Traffic waehrend Backend-Deployments/Restarts,
  was wiederholt zu False-Positive-Bans gefuehrt hat.
filter: "evt.Meta.log_type == 'netbird-proxy-error'"
leakspeed: "30s"
capacity: 15
groupby: "evt.Meta.source_ip"
blackhole: 5m
labels:
  service: http
  type: scan
  remediation: false
